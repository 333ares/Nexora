@if (showHeader) {
<header class="header">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- BRAND -->
    <div class="header-brand" routerLink="/inicio">

        <!-- Icon / Logo -->
        <div class="brand-icon">
            <img src="https://i.postimg.cc/L5z2RXk5/logo-nexora-pequeño.webp" alt="Fincan.io logo"
                width="56" height="56" />
        </div>

        <!-- Text logo -->
        <div class="brand-text">
            <img src="https://i.postimg.cc/t4mTBsBb/letras-nexora-blanco.webp" alt="Logo Nexora letras"
                class="logo2"/>
        </div>

    </div>

    <!-- NAVIGATION -->
    <nav class="header-nav">
        <button class="nav-item" routerLink="/foro" routerLinkActive="active">
            {{ 'MOV.FORO' | translate }}
        </button>

        <button class="nav-item" routerLink="/movimientos" routerLinkActive="active">
            {{ 'MOV.MOVIMIENTOS' | translate }}
        </button>

        <button class="nav-item" routerLink="/perfil" routerLinkActive="active">
            {{ 'MOV.PERFIL' | translate }}
        </button>
    </nav>
    <div style="justify-self: end; display: flex; align-items: center; gap: 15px;">
        <app-language-selector></app-language-selector>
        <div class="saldo-circle-sm"></div>
    </div>
</header>
}

<!-- ROUTER CONTENT -->
<router-outlet></router-outlet>
