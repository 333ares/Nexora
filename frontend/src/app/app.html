@if (showHeader) {
<header class="header">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- BRAND -->
    <div class="header-brand" routerLink="/inicio">

        <!-- Icon / Logo -->
        <div class="brand-icon">
            <img src="https://i.postimg.cc/RFGT0P0K/Chat-GPT-Image-15-abr-2026-17-09-39.png" alt="Fincan.io logo"
                width="56" height="56" />
        </div>

        <!-- Text logo -->
        <div class="brand-text">
            <img src="https://i.postimg.cc/1tMKzWz4/Chat-GPT-Image-15-abr-2026-17-11-47.png" alt="Logo Nexora letras"
                class="logo2"/>
        </div>

    </div>

    <!-- NAVIGATION -->
    <nav class="header-nav">
        <button class="nav-item" routerLink="/foro" routerLinkActive="active">
            {{ 'MOV.FORO' | translate }}
        </button>

        <button class="nav-item" routerLink="/movimientos" routerLinkActive="active">
            {{ 'MOV.MOVIMIENTOS' | translate }}
        </button>

        <button class="nav-item" routerLink="/perfil" routerLinkActive="active">
            {{ 'MOV.PERFIL' | translate }}
        </button>
    </nav>
    <!-- LADO DERECHO: selector de idioma + botón hamburguesa (hamburguesa solo visible en móvil) -->
    <div class="header-right">
        <app-language-selector></app-language-selector>
        <!-- Círculo decorativo posicionado de forma absoluta, no afecta al flujo flex -->
        <div class="saldo-circle-sm"></div>

        <!-- Botón hamburguesa: tres líneas que se transforman en X al abrirse.
             [class.open] añade la clase .open cuando menuOpen es true, disparando la animación CSS -->
        <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

</header>

<!-- MENÚ MÓVIL: se despliega debajo del header en pantallas pequeñas.
     [class.open] controla visibilidad y animación de entrada -->
<div class="mobile-nav" [class.open]="menuOpen">

    <!-- Cada botón cierra el menú al hacer clic para que no quede abierto tras navegar -->
    <button class="mobile-nav-item" routerLink="/foro" routerLinkActive="active" (click)="closeMenu()">
        {{ 'MOV.FORO' | translate }}
    </button>

    <button class="mobile-nav-item" routerLink="/movimientos" routerLinkActive="active" (click)="closeMenu()">
        {{ 'MOV.MOVIMIENTOS' | translate }}
    </button>

    <button class="mobile-nav-item" routerLink="/perfil" routerLinkActive="active" (click)="closeMenu()">
        {{ 'MOV.PERFIL' | translate }}
    </button>

</div>

<!-- FONDO OSCURO: cubre el contenido de fondo al abrir el menú.
     Al hacer clic sobre él se cierra el menú sin necesidad de pulsar la X -->
<div class="mobile-nav-backdrop" [class.open]="menuOpen" (click)="closeMenu()"></div>

}

<!-- ROUTER CONTENT -->
<router-outlet></router-outlet>
